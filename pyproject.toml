[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vimera"
version = "0.1.0"
description = "A reproducible framework for synthetic virome benchmarking and empirical viral detection assessment."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }

authors = [
    { name = "Gabriel Gonzalez" }
]

keywords = [
    "viromics",
    "viral metagenomics",
    "bioinformatics",
    "benchmarking",
    "metagenomics",
    "virus detection",
    "synthetic datasets"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
    "biopython>=1.84",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=6.0"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11"
]

analysis = [
    "matplotlib>=3.9",
    "seaborn>=0.13"
]

[project.scripts]
vimera = "vimera.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true