name: vimera

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python
  - python = ">=3.11,<3.15"

  # Core scientific Python
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.13
  - biopython>=1.84

  # Configuration
  - pyyaml>=6.0
  - pydantic>=2.7

  # CLI / user interface
  - typer>=0.12
  - rich>=13.7

  # System utilities
  - psutil>=6.0

  # Development
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.6
  - mypy>=1.11

  # Package installation
  - pip
  - pip:
      - -e .